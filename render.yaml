services:
  type: web
  name: login-backend-api
  runtime: java
  plan: free
  buildCommand: mvn clean package -DskipTests
  startCommand: java -jar target/login-backend-*.jar
  envVars:
    - key: SPRING_DATASOURCE_URL
      sync: false
      value: jdbc:mysql://containers-us-west-XXX.railway.app:3306/railway
    - key: SPRING_DATASOURCE_USERNAME
      sync: false
      value: root
    - key: SPRING_DATASOURCE_PASSWORD
      sync: false
      value: ${RAILWAY_PRIVATE_MYSQL_PASSWORD}
    - key: SPRING_JPA_HIBERNATE_DDL_AUTO
      sync: false
      value: update
    - key: JWT_SECRET
      sync: false
      value: tu_clave_secreta_super_segura_12345678901234567890
