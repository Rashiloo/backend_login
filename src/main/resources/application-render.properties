# Configuración para Render (PostgreSQL)
server.port=8080

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://databases:5432/render_db
spring.datasource.username=render_user
spring.datasource.password=render_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT
jwt.secret=tu_clave_secreta_super_segura_12345678901234567890
jwt.expiration=86400000

# Configuración CORS
spring.web.cors.allowed-origins=https://tuusuario.github.io
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
