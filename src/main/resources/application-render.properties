# Configuración para Railway (MySQL)
server.port=8080

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://containers-us-west-XXX.railway.app:3306/railway
spring.datasource.username=root
spring.datasource.password=tu_password_mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración JWT
jwt.secret=tu_clave_secreta_super_segura_12345678901234567890
jwt.expiration=86400000

# Configuración CORS
spring.web.cors.allowed-origins=https://tuusuario.github.io
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
