spring.application.name=login-backend



# Configuración dinámica para la base de datos

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# Configuración JWT dinámica

jwt.secret=${JWT_SECRET:MI_CLAVE_SUPER_SECRETA_LARGA_32_CHARS_MIN_2026}

jwt.expiration=3600000



# Puerto dinámico para Render/Railway

server.port=${PORT:8080}



# CONFIGURACIÓN DE EMAIL (VALORES DIRECTOS)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=arrc3174@gmail.com
# Asegúrate de que no haya espacios ni antes ni después del token
spring.mail.password=lymqpfevlukhffko

# Propiedades SMTP mejoradas para Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# Para ver el error real en la consola
spring.mail.properties.mail.debug=true



# Configuración de la aplicación

app.frontend.url=${FRONTEND_URL:https://frontend-login-m0xf.onrender.com}



# Configuración de producción

logging.level.com.login.login_backend=INFO

logging.level.org.springframework.security=WARN

logging.level.org.hibernate.SQL=WARN