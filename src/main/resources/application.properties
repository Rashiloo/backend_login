spring.application.name=login-backend

# Configuración dinámica para la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración JWT dinámica
jwt.secret=${JWT_SECRET:MI_CLAVE_SUPER_SECRETA_LARGA_32_CHARS_MIN_2026}
jwt.expiration=3600000

# Puerto dinámico para Render/Railway
server.port=${PORT:8080}