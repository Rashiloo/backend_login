spring.application.name=login-backend

# Configuración dinámica para la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración JWT dinámica
jwt.secret=${JWT_SECRET:MI_CLAVE_SUPER_SECRETA_LARGA_32_CHARS_MIN_2026}
jwt.expiration=3600000

# Puerto dinámico para Render/Railway
server.port=${PORT:8080}

# Configuración de Email (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:tu-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de la aplicación
app.frontend.url=${FRONTEND_URL:https://frontend-login-m0xf.onrender.com}

# Configuración de producción
logging.level.com.login.login_backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Forzar deploy - v2